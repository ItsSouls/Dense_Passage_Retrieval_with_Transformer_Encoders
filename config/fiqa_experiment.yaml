defaults:
  - _self_  # Hydra magic
  - dataset: fiqa
  - retriever: tf_idf
  - model: encoder


device: cpu
base_path: "."
top_k: 10
k_values: [1, 5, 10, 20]

# Keep Hydra in the current directory to ensure relative paths are correct
hydra:
  run:
     dir: "outputs/${dataset.name}/${retriever.method}/"  # One folder per dataset and method